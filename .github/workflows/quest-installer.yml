name: Quest Installer CI
on:
  push:
    branches: [quest/installer-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: quest/host/go.sum
      - run: dotnet test quest/windows/VibertemisManager.Core.Tests -f net8.0 -c Release --nologo -v minimal
      - working-directory: quest/host
        run: |
          go vet ./...
          go test -race -count=1 ./...
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.97.1
      - name: Verify native toolchains
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { throw 'cmake is not available' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clangDir = @(
            "$env:ProgramFiles\LLVM\bin",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'libclang.dll')) } | Select-Object -First 1
          if (-not $clangDir) { throw 'LLVM libclang.dll is not available' }
          "LIBCLANG_PATH=$clangDir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore native compilation cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Extracted Cargo sources (registry/src) are intentionally not cached: a canceled run can leave partial extractions.
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            build/quest/alvr/target
            ~/.cargo/bin/cargo-about.exe
          key: quest-native-windows-rust1971-v2-${{ github.sha }}
          restore-keys: quest-native-windows-rust1971-v2-
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: quest/host/go.sum
      - name: Test Core and real companion export
        run: dotnet test quest/windows/VibertemisManager.Core.Tests -f net8.0 -c Release --nologo -v minimal
      - name: Test Windows companion and standalone pairing
        working-directory: quest/host
        run: go test -count=1 ./...
      - name: Build verified installer payload
        shell: pwsh
        run: ./quest/installer/build-installer.ps1
      - name: Save native compilation cache
        if: success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Extracted Cargo sources (registry/src) are intentionally not cached: a canceled run can leave partial extractions.
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            build/quest/alvr/target
            ~/.cargo/bin/cargo-about.exe
          key: quest-native-windows-rust1971-v2-${{ github.sha }}
      - name: Verify real Windows prerequisite inspection
        shell: pwsh
        run: |
          $env:VIBERTEMIS_VC_REDIST_TEST_FILE = Join-Path $PWD 'build/installer/vc_redist.x64.exe'
          dotnet test quest/windows/VibertemisManager.Core.Tests -f net8.0-windows -c Release --nologo -v minimal
          if ($LASTEXITCODE) { throw 'Windows prerequisite tests failed' }
      - name: Install, refuse busy sessions, retain settings, uninstall
        shell: pwsh
        run: ./quest/installer/smoke-windows.ps1
      - name: Real signed update handoff and verification
        shell: pwsh
        run: ./quest/installer/smoke-update.ps1
      - name: Repeat handoff to verify window readiness
        shell: pwsh
        run: ./quest/installer/smoke-update.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vibertemisvr-hostmanager-setup-0.1.0.11
          path: build/installer/VibertemisVR-HostManager-Setup-0.1.0.11.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installer-smoke-artifacts
          path: |
            build/installer/smoke-*.log
            build/installer/smoke-*.png
          if-no-files-found: ignore