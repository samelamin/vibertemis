name: Quest Native Codec CI
on:
  push:
    branches: [quest/native-codec-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.97.1
      - name: Build matching Windows PCVR runtime
        shell: pwsh
        run: ./quest/native/build-windows.ps1
      - name: Upload draft native build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quest-native-windows-draft
          path: build/quest/alvr/build/alvr_streamer_windows/
          if-no-files-found: error
          retention-days: 14
